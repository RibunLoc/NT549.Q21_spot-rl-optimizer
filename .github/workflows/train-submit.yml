# Gửi một lần train lên Kaggle rồi kết thúc ngay (không ngồi chờ).
# Kết quả do train-check.yml theo dõi.
#
# Chỉ chạy khi bấm tay: Actions → train-submit → Run workflow.
# KHÔNG dùng push / pull_request / pull_request_target:
#   - mỗi lần chạy tốn GPU Kaggle (~30 giờ/tuần)
#   - workflow dùng secrets; PR từ fork không được chạm vào secrets
#
# Cách truyền tham số sang Kaggle: điền commit + config vào 2 placeholder
# (__GIT_SHA__, __RUN_CONFIG__) trong bản copy của notebook rồi push.
# Notebook tự `git fetch` đúng commit đó và `dvc pull` data từ S3,
# nên không cần upload code/data lên Kaggle Dataset.
name: train-submit

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Config train (đường dẫn trong repo)"
        required: true
        default: experiments/configs/generalist/s5_simple_reward.yaml

# Không cho 2 lần submit chạy song song
concurrency:
  group: kaggle-train
  cancel-in-progress: false

permissions:
  contents: read

env:
  KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
  KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
  # Slug notebook trên Kaggle — PHẢI giống train-check.yml.
  # Title trong kaggle/kernel/kernel-metadata.json phải "slug hoá" ra đúng chuỗi này.
  KAGGLE_KERNEL_SLUG: reinforcement-learning-spot-instance-aws

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # `six`: Kaggle CLI vẫn import nhưng không khai báo dependency
      # → thiếu là `ModuleNotFoundError: No module named 'six'`
      - name: Install Kaggle CLI
        run: |
          pip install kaggle six
          kaggle --version

      # Secret dán lỡ dính dấu cách / xuống dòng → slug thành "user /..." → Permission denied
      - name: Check Kaggle credentials
        run: |
          if [[ "$KAGGLE_USERNAME" =~ [[:space:]] || -z "$KAGGLE_USERNAME" ]]; then
            echo "::error::Secret KAGGLE_USERNAME rỗng hoặc có dấu cách/xuống dòng. Tạo lại secret."; exit 1
          fi
          if [[ "$KAGGLE_KEY" =~ [[:space:]] || -z "$KAGGLE_KEY" ]]; then
            echo "::error::Secret KAGGLE_KEY rỗng hoặc có dấu cách/xuống dòng. Tạo lại secret."; exit 1
          fi
          echo "Notebook của tài khoản này (cột ref = owner/slug):"
          kaggle kernels list --mine --page-size 50

      - name: Validate config path
        env:
          CONFIG: ${{ inputs.config }}
        run: |
          [[ "$CONFIG" =~ ^experiments/configs/[A-Za-z0-9_./-]+\.ya?ml$ ]] \
            || { echo "::error::Đường dẫn config không hợp lệ: $CONFIG"; exit 1; }
          test -f "$CONFIG" || { echo "::error::Không thấy config trong commit này: $CONFIG"; exit 1; }

      - name: Refuse if a training run is still going
        run: |
          # KHÔNG dùng `|| true`: CLI hỏng (thiếu module, sai key) phải làm workflow đỏ,
          # chỉ bỏ qua đúng trường hợp kernel chưa tồn tại (lần submit đầu tiên).
          if ! status=$(kaggle kernels status "${KAGGLE_USERNAME}/${KAGGLE_KERNEL_SLUG}" 2>&1); then
            if echo "$status" | grep -qiE "404|not found"; then
              echo "Kernel chưa tồn tại → lần đầu, sẽ tạo mới"; exit 0
            fi
            echo "::error::Kaggle CLI lỗi: $status"; exit 1
          fi
          echo "Kernel status: $status"
          case "$status" in
            *RUNNING*|*QUEUED*)
              echo "::error::Kaggle đang train dở. Đợi xong hoặc cancel trên Kaggle rồi submit lại."
              exit 1 ;;
          esac

      - name: Prepare kernel (fill username + run params)
        env:
          CONFIG: ${{ inputs.config }}
        run: |
          sed -i -e "s/KAGGLE_USER/${KAGGLE_USERNAME}/g" -e "s/KERNEL_SLUG/${KAGGLE_KERNEL_SLUG}/g" \
            kaggle/kernel/kernel-metadata.json
          cat kaggle/kernel/kernel-metadata.json
          cp notebooks/kaggle_train.ipynb kaggle/kernel/kaggle_train.ipynb
          sed -i -e "s|__GIT_SHA__|${GITHUB_SHA}|" -e "s|__RUN_CONFIG__|${CONFIG}|" \
            kaggle/kernel/kaggle_train.ipynb
          # Chắc chắn đã điền được, tránh train nhầm commit/config mặc định
          grep -q "GIT_SHA = '${GITHUB_SHA}'" kaggle/kernel/kaggle_train.ipynb \
            || { echo "::error::Không điền được GIT_SHA vào notebook"; exit 1; }
          grep -q "RUN_CONFIG = '${CONFIG}'" kaggle/kernel/kaggle_train.ipynb \
            || { echo "::error::Không điền được RUN_CONFIG vào notebook"; exit 1; }

      - name: Push kernel (start training)
        run: kaggle kernels push -p kaggle/kernel

      - name: Summary
        env:
          CONFIG: ${{ inputs.config }}
        run: |
          {
            echo "### Đã gửi train lên Kaggle"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Config: \`${CONFIG}\`"
            echo "- Kernel: https://www.kaggle.com/code/${KAGGLE_USERNAME}/${KAGGLE_KERNEL_SLUG}"
            echo "- Theo dõi: workflow **train-check**"
          } >> "$GITHUB_STEP_SUMMARY"
